site_name: Guía de despliegue Flask
site_description: Flask gratis en Oracle Always Free con Docker, Caddy (HTTPS), GitHub Actions y Cloudflare
site_url: https://ricy24.github.io/guia-despliegue-flask/
repo_url: https://github.com/Ricy24/guia-despliegue-flask
repo_name: Ricy24/guia-despliegue-flask
edit_uri: edit/main/docs/

theme:
  name: material
  language: es
  palette:
    - scheme: default
      primary: teal
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Cambiar a modo oscuro
    - scheme: slate
      primary: teal
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Cambiar a modo claro
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - toc:
      permalink: true

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js
  - javascripts/mermaid.js

nav:
  - Inicio: index.md
  - La guía:
      - "00 — Qué vamos a hacer": 00-que-vamos-a-hacer.md
      - "01 — Las cuentas gratis": 01-cuentas-gratis.md
      - "02 — Cuenta de Oracle": 02-cuenta-oracle.md
      - "03 — Red e instancia": 03-red-e-instancia.md
      - "04 — SSH y firewall": 04-conexion-y-firewall.md
      - "05 — Docker en el servidor": 05-docker-en-el-vps.md
      - "06 — DuckDNS": 06-dominio-gratis.md
      - "07 — Caddy y HTTPS": 07-caddy-https.md
      - "08 — Tu Flask en Docker": 08-app-flask-en-docker.md
      - "09 — Pruebas automáticas": 09-tests-github-actions.md
      - "10 — Despliegue automático": 10-despliegue-automatico.md
      - "11 — Frontend en Vercel": 11-frontend-vercel.md
      - "12 — Cloudflare": 12-cloudflare.md
      - "13 — Checklist de producción": 13-checklist-produccion.md
      - "14 — Sin Docker": 14-sin-docker.md
      - Troubleshooting: troubleshooting.md
